# Variante HTTPS (Let's Encrypt / certificado propio)
#
# Uso:
#   1. Obtén certificado (ej. certbot)
#   2. Ajusta server_name y rutas de certificado
#   3. sudo cp deploy/nginx/soporte-web-ssl.conf /etc/nginx/sites-available/soporte-web
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# En .env de producción:
#   APP_URL=https://soporte.tudominio.local
#   SESSION_SECURE_COOKIE=true
#   VITE_REVERB_SCHEME=https
#   VITE_REVERB_PORT=443
#   VITE_REVERB_HOST=soporte.tudominio.local
# Luego: npm run build && php artisan config:cache

server {
    listen 80;
    listen [::]:80;
    server_name soporte.tudominio.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soporte.tudominio.local;

    root /var/www/soporte-web/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/soporte.tudominio.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soporte.tudominio.local/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
    }

    location /apps {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/soporte-web.access.log;
    error_log  /var/log/nginx/soporte-web.error.log;
}
